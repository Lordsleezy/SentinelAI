name: Build Consumer Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.2)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Install Node dependencies
        working-directory: desktop-shell
        run: npm ci

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ver = '${{ github.event.inputs.version }}'
          if (-not $ver) {
            $tag = '${{ github.ref_name }}'
            $ver = $tag -replace '^v', ''
          }
          if (-not $ver) {
            $pkg = Get-Content desktop-shell/package.json | ConvertFrom-Json
            $ver = $pkg.version
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Generate build_info.py
        shell: pwsh
        run: scripts/generate_build_info.ps1 -BuildType consumer -Version ${{ steps.version.outputs.VERSION }}

      - name: Build Python backend (consumer)
        shell: pwsh
        run: |
          pyinstaller build_backend_consumer.spec `
            --distpath backend_dist `
            --workpath build_tmp/consumer `
            --noconfirm --clean

      - name: Build Electron installer (consumer)
        shell: pwsh
        working-directory: desktop-shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --publish never `
            --config.extraMetadata.version="${{ steps.version.outputs.VERSION }}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAI-Consumer-${{ steps.version.outputs.VERSION }}
          path: installer_dist/*.exe
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
