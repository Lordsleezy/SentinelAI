<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forge</title>
  <link rel="stylesheet" href="./node_modules/monaco-editor/min/vs/editor/editor.main.css">
  <link rel="stylesheet" href="./node_modules/@xterm/xterm/css/xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      background: #111118;
      border-bottom: 1px solid rgba(0,255,136,0.15);
      padding: 8px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 6px 14px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn.secondary {
      background: rgba(255,255,255,0.1);
      color: #e0e0e0;
    }

    #editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    #monaco-editor {
      flex: 1;
    }

    #terminal-panel {
      height: 30%;
      border-top: 1px solid rgba(0,255,136,0.15);
      background: #0a0a0f;
      overflow: hidden;
    }

    #terminal {
      width: 100%;
      height: 100%;
      padding: 8px;
    }

    .status-bar {
      padding: 4px 12px;
      background: #18181f;
      border-top: 1px solid rgba(0,255,136,0.15);
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button class="btn" id="btn-run">Run Forge Task</button>
    <button class="btn secondary" id="btn-diff">Show Diff</button>
    <button class="btn secondary" id="btn-clear">Clear Editor</button>
    <div style="flex: 1;"></div>
    <span id="status-text">Ready</span>
  </div>

  <div id="editor-container">
    <div id="monaco-editor"></div>
    <div id="terminal-panel">
      <div id="terminal"></div>
    </div>
  </div>

  <div class="status-bar">Forge Script Editor - Monaco Editor with integrated terminal</div>

  <script src="./node_modules/monaco-editor/min/vs/loader.js"></script>

  <script>
    let editor = null;
    let terminal = null;

    // Initialize Monaco Editor from local node_modules
    require.config({ paths: { vs: './node_modules/monaco-editor/min/vs' }});

    require(['vs/editor/editor.main'], function() {
      editor = monaco.editor.create(document.getElementById('monaco-editor'), {
        value: '# Write your Forge task here\n# Example: Fix the bug in auth.py\n',
        language: 'markdown',
        theme: 'vs-dark',
        automaticLayout: true,
        minimap: { enabled: true },
        fontSize: 14,
        lineNumbers: 'on',
        wordWrap: 'on'
      });
    });

    // Initialize xterm.js terminal from local node_modules
    const { Terminal } = require('@xterm/xterm');
    const { FitAddon } = require('@xterm/addon-fit');

    terminal = new Terminal({
      cursorBlink: true,
      theme: {
        background: '#0a0a0f',
        foreground: '#e0e0e0'
      }
    });

    const fitAddon = new FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(document.getElementById('terminal'));
    fitAddon.fit();

    window.addEventListener('resize', () => {
      if (fitAddon) fitAddon.fit();
    });

    // Write to terminal via IPC
    try {
      const { ipcRenderer } = require('electron');

      ipcRenderer.on('terminal-output', (event, data) => {
        terminal.write(data);
      });

      terminal.onData(data => {
        ipcRenderer.send('terminal-input', data);
      });

      ipcRenderer.on('forge-context', (event, context) => {
        if (context.task) {
          editor.setValue(`# Forge Task: ${context.task}\n\n${context.prompt || ''}`);
        }
      });
    } catch (e) {
      console.error('Electron IPC not available:', e);
    }

    // Run button
    document.getElementById('btn-run').addEventListener('click', async () => {
      const task = editor ? editor.getValue() : '';
      if (!task || task.trim().startsWith('#')) {
        alert('Please enter a task description in the editor (not just comments).');
        return;
      }

      const approved = confirm(`Forge will execute this task:\n\n"${task.substring(0, 200)}${task.length > 200 ? '...' : ''}"\n\nApprove?`);
      if (!approved) return;

      document.getElementById('status-text').textContent = 'Running...';
      if (terminal) terminal.writeln('\r\n\x1b[33m[Forge]\x1b[0m Submitting task...');

      try {
        const res = await fetch('http://127.0.0.1:5001/api/forge/request', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({prompt: task, requires_approval: false})
        });
        const data = await res.json();

        if (terminal) {
          terminal.writeln(`\r\n\x1b[32m[Forge]\x1b[0m Task queued — ID: ${data.forge_task_id || data.task_id || 'unknown'}`);
          terminal.writeln(`\x1b[33m[Forge]\x1b[0m Status: ${data.status || 'pending'}`);
          if (data.message) terminal.writeln(`\x1b[33m[Forge]\x1b[0m ${data.message}`);
        }
        document.getElementById('status-text').textContent = data.status || 'queued';

        if (data.result && data.result.code) {
          editor.setValue(data.result.code);
        }
      } catch (e) {
        if (terminal) terminal.writeln(`\r\n\x1b[31m[Error]\x1b[0m ${e.message}`);
        document.getElementById('status-text').textContent = 'Error';
        console.error('Forge request failed:', e);
      }
    });

    // Clear button
    document.getElementById('btn-clear').addEventListener('click', () => {
      editor.setValue('# Write your Forge task here\n');
    });

    terminal.writeln('Forge terminal ready. Output will appear here.');
  </script>
</body>
</html>
