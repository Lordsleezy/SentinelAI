<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #orb-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #input-section {
      padding: 24px;
      background: rgba(10,10,15,0.95);
      border-top: 1px solid rgba(0,255,136,0.15);
    }

    #chat-input {
      width: 100%;
      background: #18181f;
      border: 1px solid rgba(0,255,136,0.15);
      color: #e0e0e0;
      padding: 14px 18px;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #chat-input:focus {
      border-color: rgba(0,255,136,0.4);
      box-shadow: 0 0 12px rgba(0,255,136,0.2);
    }

    #status-line {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      padding: 0 8px;
    }

    .worker-badge {
      font-size: 11px;
      padding: 4px 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .worker-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
    }

    .worker-badge.running .dot {
      background: #00ff88;
      box-shadow: 0 0 4px #00ff88;
      animation: pulse 2s infinite;
    }

    .worker-badge.waiting .dot {
      background: #ffa500;
      box-shadow: 0 0 4px #ffa500;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #response-area {
      position: absolute;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      background: rgba(18,18,31,0.95);
      border: 1px solid rgba(0,255,136,0.15);
      border-radius: 12px;
      padding: 16px;
      display: none;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    #response-area.visible {
      display: block;
    }

    #plan-preview {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(18,18,31,0.98);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #plan-preview.visible {
      display: block;
    }

    #plan-preview h2 {
      margin-bottom: 16px;
      color: #00ff88;
      font-size: 18px;
    }

    #plan-preview .plan-complexity {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 16px;
      color: #00ff88;
    }

    .plan-subtask {
      margin-bottom: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-left: 2px solid rgba(0,255,136,0.3);
      border-radius: 4px;
    }

    .plan-subtask-index {
      font-weight: bold;
      color: #00ff88;
    }

    .plan-subtask-type {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(0,200,255,0.2);
      border-radius: 4px;
      margin-left: 8px;
      color: #00ccff;
    }

    .plan-subtask-text {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.5;
      color: #d0d0d0;
    }

    #plan-controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      border-top: 1px solid rgba(0,255,136,0.1);
      padding-top: 16px;
    }

    .plan-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 6px;
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .plan-btn:hover {
      background: rgba(0,255,136,0.2);
      border-color: rgba(0,255,136,0.5);
    }

    .plan-btn.deny {
      color: #ff6b6b;
      border-color: rgba(255,107,107,0.3);
      background: rgba(255,107,107,0.05);
    }

    .plan-btn.deny:hover {
      background: rgba(255,107,107,0.15);
      border-color: rgba(255,107,107,0.5);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0,255,136,0.3);
      border-radius: 2px;
    }

    .tier-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      z-index: 100;
    }

    .tier-badge.free {
      background: rgba(100,100,100,0.2);
      border: 1px solid rgba(100,100,100,0.4);
      color: #999;
    }

    .tier-badge.pro {
      background: rgba(255,215,0,0.15);
      border: 1px solid rgba(255,215,0,0.4);
      color: #ffd700;
      box-shadow: 0 0 12px rgba(255,215,0,0.2);
    }

    .tier-badge:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    #upgrade-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    #upgrade-modal.visible {
      display: flex;
    }

    #upgrade-modal-content {
      background: rgba(18,18,31,0.98);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #upgrade-modal-content h2 {
      margin-bottom: 12px;
      color: #ffd700;
      font-size: 22px;
    }

    #upgrade-modal-content p {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    #upgrade-modal-buttons {
      display: flex;
      gap: 12px;
    }

    #upgrade-modal-buttons button {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(0,255,136,0.3);
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    #upgrade-modal-buttons button:hover {
      background: rgba(0,255,136,0.2);
      border-color: rgba(0,255,136,0.6);
    }

    #upgrade-modal-buttons button.secondary {
      background: rgba(100,100,100,0.1);
      border-color: rgba(100,100,100,0.3);
      color: #888;
    }

    #upgrade-modal-buttons button.secondary:hover {
      background: rgba(100,100,100,0.2);
      border-color: rgba(100,100,100,0.5);
    }

    #activation-panel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(18,18,31,0.98);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      display: none;
      z-index: 2100;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #activation-panel.visible {
      display: block;
    }

    #activation-panel h3 {
      margin-bottom: 16px;
      color: #00ff88;
      font-size: 16px;
    }

    #activation-panel input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 6px;
      color: #e0e0e0;
      margin-bottom: 12px;
      font-size: 13px;
    }

    #activation-panel input:focus {
      border-color: rgba(0,255,136,0.5);
      outline: none;
    }

    #activation-panel .message {
      font-size: 12px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }

    #activation-panel .message.success {
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      border: 1px solid rgba(0,255,136,0.2);
      display: block;
    }

    #activation-panel .message.error {
      background: rgba(255,107,107,0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255,107,107,0.2);
      display: block;
    }

    #activation-panel .buttons {
      display: flex;
      gap: 8px;
    }

    #activation-panel .buttons button {
      flex: 1;
      padding: 10px;
      border: 1px solid rgba(0,255,136,0.3);
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    #activation-panel .buttons button:hover {
      background: rgba(0,255,136,0.2);
    }

    .usage-counter {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      color: #888;
      max-width: 200px;
    }

    .usage-counter.free {
      display: block;
    }

    .usage-counter.pro {
      display: none;
    }
  </style>
</head>
<body>
  <div id="orb-container">
    <div id="orb-root" style="width: 400px; height: 400px;"></div>
    <div id="response-area"></div>
    <div id="plan-preview"></div>
    <div class="tier-badge" id="tier-badge">FREE</div>
    <div class="usage-counter" id="usage-counter"></div>
  </div>

  <div id="upgrade-modal">
    <div id="upgrade-modal-content">
      <h2>Upgrade to SentinelAI Pro</h2>
      <p id="upgrade-message"></p>
      <div id="upgrade-modal-buttons">
        <button onclick="appShowActivationPanel()">Activate License Key</button>
        <button class="secondary" onclick="openPricingPage()">Get Pro — $199</button>
      </div>
    </div>
  </div>

  <div id="activation-panel">
    <h3>Activate SentinelAI Pro</h3>
    <input type="text" id="license-key-input" placeholder="Enter your license key">
    <div class="message" id="activation-message"></div>
    <div class="buttons">
      <button onclick="appActivateLicense()">Activate</button>
      <button class="secondary" onclick="appCloseActivationPanel()">Cancel</button>
    </div>
  </div>

  <div id="input-section">
    <input
      id="chat-input"
      type="text"
      placeholder="Ask Sentinel anything..."
      autocomplete="off"
    />
    <div id="status-line"></div>
  </div>

  <script>
    // 3D orb via pure Three.js (loaded via Node require — nodeIntegration is on)
    const THREE = require('three');

    let orbState = 'idle';
    let _orbScene = null, _orbRenderer = null, _orbMesh = null, _orbAnimFrame = null, _orbLights = null;
    let _voiceOrbSetState = null;

    function initOrb() {
      const container = document.getElementById('orb-root');
      if (!container || _orbRenderer) return;

      const w = container.clientWidth || 400;
      const h = container.clientHeight || 400;

      // Create canvas inside container
      const canvas = document.createElement('canvas');
      canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
      container.style.position = 'relative';
      container.appendChild(canvas);

      _orbScene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, w/h, 0.1, 1000);
      camera.position.z = 5;

      _orbRenderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true});
      _orbRenderer.setSize(w, h);
      _orbRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      _orbRenderer.setClearColor(0x000000, 1);

      // ── VoiceOrb shader-based layered sphere (adapted from aguscruiz/voiceorb) ──

      // State configs — all blue/cyan/purple, no orange or pink
      const voiceStates = {
        idle: {
          layers: [
            { color: 0x434FCF, opacity: 0.20, scale: 1.00, rotationSpeed: { x: 0.001, y: 0.002, z: 0 } },
            { color: 0x434FCF, opacity: 0.20, scale: 0.85, rotationSpeed: { x: -0.002, y: 0.003, z: 0.001 } },
            { color: 0x434FCF, opacity: 0.40, scale: 0.70, rotationSpeed: { x: 0.003, y: -0.002, z: -0.001 } }
          ],
          audioLevel: 0.15, timeSpeed: 0.015, pulsate: false, chromaticAberration: 0.8
        },
        thinking: {
          layers: [
            { color: 0x8747F7, opacity: 0.20, scale: 0.85, rotationSpeed: { x: 0.003, y: 0.003, z: 0 } },
            { color: 0x8747F7, opacity: 0.20, scale: 0.72, rotationSpeed: { x: -0.004, y: 0.004, z: 0.002 } },
            { color: 0x8747F7, opacity: 0.40, scale: 0.60, rotationSpeed: { x: 0.005, y: -0.004, z: -0.002 } }
          ],
          audioLevel: 0.45, timeSpeed: 0.02,
          pulsate: true, pulsateMode: 'thinking', pulsateMin: 0.0, pulsateMax: 0.15,
          chromaticAberration: 0.8
        },
        speaking: {
          layers: [
            { color: 0x00aaff, opacity: 0.20, scale: 1.00, rotationSpeed: { x: 0.004, y: 0.005, z: 0 } },
            { color: 0x0088ff, opacity: 0.20, scale: 0.85, rotationSpeed: { x: -0.005, y: 0.006, z: 0.003 } },
            { color: 0x00ddff, opacity: 0.40, scale: 0.70, rotationSpeed: { x: 0.006, y: -0.005, z: -0.002 } }
          ],
          audioLevel: 0.80, timeSpeed: 0.027,
          pulsate: true, pulsateMode: 'cadence', pulsateMin: 0.05, pulsateMax: 0.22,
          chromaticAberration: 1.5
        }
      };

      const vertexShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec2 vUv;
        uniform float time;
        uniform float audioLevel;
        uniform float layerOffset;
        vec3 mod289v3(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
        vec4 mod289v4(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
        vec4 permute(vec4 x){return mod289v4(((x*34.0)+1.0)*x);}
        vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
        float snoise(vec3 v){
          const vec2 C=vec2(1.0/6.0,1.0/3.0);const vec4 D=vec4(0.0,0.5,1.0,2.0);
          vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
          vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.0-g;
          vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
          vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
          i=mod289v3(i);
          vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
          float n_=0.142857142857;vec3 ns=n_*D.wyz-D.xzx;
          vec4 j=p-49.0*floor(p*ns.z*ns.z);
          vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.0*x_);
          vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.0-abs(x)-abs(y);
          vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
          vec4 s0=floor(b0)*2.0+1.0;vec4 s1=floor(b1)*2.0+1.0;vec4 sh=-step(h,vec4(0.0));
          vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
          vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
          vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
          p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
          vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);m=m*m;
          return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
        }
        void main(){
          vUv=uv;vNormal=normalize(normalMatrix*normal);
          vec3 pos=position;
          float wave1=sin(pos.y*2.5+time*1.5+layerOffset)*cos(pos.x*2.0-time*1.2);
          float wave2=sin(pos.x*3.0-time*1.8+layerOffset)*cos(pos.z*2.5+time*1.5);
          float wave3=sin(pos.z*2.8+time*1.6+layerOffset)*cos(pos.y*2.3-time*1.3);
          float noise1=snoise(pos*1.2+time*0.3+layerOffset);
          float noise2=snoise(pos*2.0-time*0.2+layerOffset*0.5);
          float distortion=(wave1+wave2+wave3)*0.008;
          distortion+=(noise1*0.008+noise2*0.007);
          distortion*=(0.3+audioLevel*0.6);
          pos=pos+normal*distortion;
          vPosition=pos;
          gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
        }
      `;

      const fragmentShader = `
        varying vec3 vNormal;
        varying vec3 vPosition;
        varying vec2 vUv;
        uniform vec3 sphereColor;
        uniform float opacity;
        uniform float time;
        uniform float chromaticAberration;
        vec3 rgb2hsv(vec3 c){
          vec4 K=vec4(0.0,-1.0/3.0,2.0/3.0,-1.0);
          vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));
          vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));
          float d=q.x-min(q.w,q.y);float e=1.0e-10;
          return vec3(abs(q.z+(q.w-q.y)/(6.0*d+e)),d/(q.x+e),q.x);
        }
        vec3 hsv2rgb(vec3 c){
          vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);
          vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);
          return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);
        }
        void main(){
          vec3 viewDirection=normalize(cameraPosition-vPosition);
          float fresnel=pow(1.0-abs(dot(viewDirection,normalize(vNormal))),2.0);
          vec3 normalWorld=normalize(vNormal);
          float rainbowShift=normalWorld.x*0.5+normalWorld.y*0.2+normalWorld.z*0.1;
          rainbowShift+=sin(vPosition.x*5.0+time*0.5)*0.01;
          rainbowShift+=cos(vPosition.y*4.0-time*0.3)*0.01;
          rainbowShift=fract(rainbowShift);
          vec3 rainbow=hsv2rgb(vec3(rainbowShift,0.8,1.0));
          vec3 hsv=rgb2hsv(sphereColor);
          float aberrationAmount=chromaticAberration*fresnel;
          vec3 hsvR=hsv;hsvR.x=fract(hsv.x+aberrationAmount*0.15);vec3 colorR=hsv2rgb(hsvR);
          vec3 colorG=sphereColor;
          vec3 hsvB=hsv;hsvB.x=fract(hsv.x-aberrationAmount*0.15);vec3 colorB=hsv2rgb(hsvB);
          vec3 color=vec3(colorR.r,colorG.g,colorB.b);
          float holographicIntensity=fresnel*0.6+0.2;
          color=mix(color,rainbow,holographicIntensity*0.6);
          color+=fresnel*chromaticAberration*0.15;
          float brightness=1.0+sin(vPosition.x*3.0+time)*0.1;
          brightness+=sin(vPosition.y*2.5-time*0.8)*0.1;
          float shimmer=sin(vPosition.x*8.0+vPosition.y*6.0+time*2.0)*0.04+0.96;
          brightness*=shimmer;
          color*=brightness;
          gl_FragColor=vec4(color,opacity);
        }
      `;

      // Build layered spheres
      const orbLayers = [];
      voiceStates.idle.layers.forEach((layerCfg, idx) => {
        const geometry = new THREE.SphereGeometry(1.0, 64, 64);
        const material = new THREE.ShaderMaterial({
          vertexShader, fragmentShader,
          uniforms: {
            time: { value: 0 },
            audioLevel: { value: 0 },
            layerOffset: { value: idx * 2.0 },
            sphereColor: { value: new THREE.Color(layerCfg.color) },
            opacity: { value: layerCfg.opacity },
            chromaticAberration: { value: 0.8 }
          },
          transparent: true, side: THREE.DoubleSide,
          blending: THREE.NormalBlending, depthWrite: false
        });
        const sphere = new THREE.Mesh(geometry, material);
        sphere.userData = { baseScale: layerCfg.scale, rotationSpeed: layerCfg.rotationSpeed };
        _orbScene.add(sphere);
        orbLayers.push(sphere);
      });

      // Lighting
      _orbScene.add(new THREE.AmbientLight(0xffffff, 0.4));
      const pl1 = new THREE.PointLight(0x667eea, 0.6, 100);
      pl1.position.set(5, 5, 5); _orbScene.add(pl1);
      const pl2 = new THREE.PointLight(0x764ba2, 0.4, 100);
      pl2.position.set(-5, -5, 5); _orbScene.add(pl2);
      _orbLights = [pl1, pl2];
      _orbMesh = orbLayers[0] || null;

      // State machine
      let _voiceCurrentState = 'idle';
      let _voiceTargetScale = 1.0, _voiceCurrentScale = 1.0;
      let _speakingCadence = { intensity: 0.5, nextChange: 0 };

      function voiceSetState(stateName) {
        const s = voiceStates[stateName];
        if (!s || _voiceCurrentState === stateName) return;
        _voiceCurrentState = stateName;
        orbLayers.forEach((layer, i) => {
          const lc = s.layers[i];
          if (!lc) return;
          layer.material.uniforms.sphereColor.value.setHex(lc.color);
          layer.material.uniforms.opacity.value = lc.opacity;
          layer.material.uniforms.chromaticAberration.value = s.chromaticAberration || 0.1;
          layer.userData.rotationSpeed = lc.rotationSpeed;
          layer.userData.baseScale = lc.scale;
        });
      }
      _voiceOrbSetState = voiceSetState;

      function updateSpeakingCadence() {
        const now = Date.now() * 0.001;
        if (now >= _speakingCadence.nextChange) {
          const t = Math.random();
          if (t < 0.3) {
            _speakingCadence.intensity = 0.7 + Math.random() * 0.3;
            _speakingCadence.nextChange = now + 0.15 + Math.random() * 0.15;
          } else if (t < 0.6) {
            _speakingCadence.intensity = 0.5 + Math.random() * 0.4;
            _speakingCadence.nextChange = now + 0.3 + Math.random() * 0.3;
          } else if (t < 0.85) {
            _speakingCadence.intensity = 0.6 + Math.random() * 0.4;
            _speakingCadence.nextChange = now + 0.5 + Math.random() * 0.4;
          } else {
            _speakingCadence.intensity = 0.1 + Math.random() * 0.2;
            _speakingCadence.nextChange = now + 0.2 + Math.random() * 0.3;
          }
        }
        return Math.max(0, _speakingCadence.intensity + Math.sin(Date.now() * 0.01) * 0.08);
      }

      // Animation loop
      (function loop() {
        _orbAnimFrame = requestAnimationFrame(loop);

        // Sync with Sentinel's orbState global
        if (_voiceCurrentState !== orbState && voiceStates[orbState]) {
          voiceSetState(orbState);
        }

        const state = voiceStates[_voiceCurrentState];

        if (state.pulsate) {
          if (state.pulsateMode === 'thinking') {
            const pulse = (Math.sin(Date.now() * 0.0015) + 1.0) / 2.0;
            _voiceTargetScale = 1.0 + state.pulsateMin + pulse * (state.pulsateMax - state.pulsateMin);
          } else if (state.pulsateMode === 'cadence') {
            const cadence = updateSpeakingCadence();
            _voiceTargetScale = 1.0 + state.pulsateMin + cadence * (state.pulsateMax - state.pulsateMin);
          }
          _voiceCurrentScale += (_voiceTargetScale - _voiceCurrentScale) * 0.15;
        } else {
          _voiceCurrentScale += (1.0 - _voiceCurrentScale) * 0.1;
        }

        orbLayers.forEach((layer) => {
          layer.material.uniforms.time.value += state.timeSpeed;
          layer.material.uniforms.audioLevel.value = state.audioLevel;
          layer.rotation.x += layer.userData.rotationSpeed.x;
          layer.rotation.y += layer.userData.rotationSpeed.y;
          layer.rotation.z += layer.userData.rotationSpeed.z;
          const ls = layer.userData.baseScale * _voiceCurrentScale;
          layer.scale.set(ls, ls, ls);
        });

        _orbRenderer.render(_orbScene, camera);
      })();

      window.addEventListener('resize', () => {
        const nw = container.clientWidth || 400;
        const nh = container.clientHeight || 400;
        camera.aspect = nw / nh;
        camera.updateProjectionMatrix();
        _orbRenderer.setSize(nw, nh);
      });
    }

    function renderOrb() {
      if (_voiceOrbSetState) _voiceOrbSetState(orbState || 'idle');
    }

    window.addEventListener('DOMContentLoaded', () => { initOrb(); renderOrb(); });

    // Worker status polling
    const statusLine = document.getElementById('status-line');
    const responseArea = document.getElementById('response-area');
    const planPreview = document.getElementById('plan-preview');
    const chatInput = document.getElementById('chat-input');

    let currentPlanId = null;

    async function updateWorkerStatus() {
      try {
        const res = await fetch('http://127.0.0.1:5001/api/workers/status');
        const data = await res.json();

        if (data && data.data) {
          const workers = [...(data.data.logical_workers || []), ...(data.data.pool_workers || [])];

          statusLine.innerHTML = workers.map(w => {
            const state = (w.state || 'idle').toLowerCase();
            const cls = state.includes('run') || state.includes('execut') ? 'running' :
                       state.includes('wait') || state.includes('pend') ? 'waiting' : '';
            return `<div class="worker-badge ${cls}"><span class="dot"></span>${escapeHtml(w.worker_id || w.intent || 'Unknown')}</div>`;
          }).join('');
        }
      } catch (e) {
        console.error('Status update failed:', e);
      }
    }

    function showPlanPreview(plan) {
      currentPlanId = plan.plan_id;
      const complexity = plan.complexity === 'complex' ? 'Complex' : 'Simple';
      const subtasksHtml = plan.subtasks.map((st, i) => `
        <div class="plan-subtask">
          <span class="plan-subtask-index">#${st.index}</span>
          <span class="plan-subtask-type">${escapeHtml(st.type)}</span>
          <div class="plan-subtask-text">${escapeHtml(st.task)}</div>
        </div>
      `).join('');

      planPreview.innerHTML = `
        <h2>Execution Plan</h2>
        <div class="plan-complexity">${complexity} Task</div>
        ${subtasksHtml}
        <div id="plan-controls">
          <button class="plan-btn" onclick="approvePlan()">Execute Plan</button>
          <button class="plan-btn deny" onclick="denyPlan()">Cancel</button>
        </div>
      `;
      planPreview.classList.add('visible');
    }

    window.approvePlan = async function() {
      if (!currentPlanId) return;
      planPreview.classList.remove('visible');
      orbState = 'thinking';
      renderOrb();

      try {
        const res = await fetch(`http://127.0.0.1:5001/orchestration/plan/${currentPlanId}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();

        orbState = 'speaking';
        renderOrb();

        const planResp = data.response;
        const planText = typeof planResp === 'string'
          ? planResp
          : (planResp?.response || planResp?.text || planResp?.message || (planResp != null ? JSON.stringify(planResp) : ''));
        responseArea.textContent = planText || 'Task completed';
        responseArea.classList.add('visible');

        setTimeout(() => {
          responseArea.classList.remove('visible');
          orbState = 'idle';
          renderOrb();
        }, 5000);

      } catch (err) {
        console.error('Plan approval failed:', err);
        orbState = 'idle';
        renderOrb();
      }
    };

    window.denyPlan = async function() {
      if (!currentPlanId) return;
      planPreview.classList.remove('visible');

      try {
        await fetch(`http://127.0.0.1:5001/orchestration/plan/${currentPlanId}/deny`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        orbState = 'idle';
        renderOrb();

        responseArea.textContent = 'Plan cancelled';
        responseArea.classList.add('visible');

        setTimeout(() => {
          responseArea.classList.remove('visible');
        }, 3000);

      } catch (err) {
        console.error('Plan denial failed:', err);
      }
    };

    setInterval(updateWorkerStatus, 3000);
    updateWorkerStatus();

    // Input handling
    chatInput.addEventListener('keydown', async (e) => {
      if (e.key === 'Enter' && chatInput.value.trim()) {
        const query = chatInput.value.trim();
        chatInput.value = '';

        orbState = 'thinking';
        renderOrb();

        try {
          // Route the query to the orchestration pipeline
          const res = await fetch('http://127.0.0.1:5001/orchestration/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: query })
          });

          const data = await res.json();

          // Check if this is a plan preview
          if (data.type === 'plan_preview') {
            orbState = 'idle';
            renderOrb();
            showPlanPreview(data.plan);
            return;
          }

          orbState = 'speaking';
          renderOrb();

          // Show response — data.response may be a string, object, or null
          const rawResp = data.response;
          const displayText = typeof rawResp === 'string'
            ? rawResp
            : (rawResp?.response || rawResp?.text || rawResp?.message || (rawResp != null ? JSON.stringify(rawResp) : ''));
          responseArea.textContent = displayText || 'Processing...';
          responseArea.classList.add('visible');

          setTimeout(() => {
            responseArea.classList.remove('visible');
            orbState = 'idle';
            renderOrb();
          }, 5000);

        } catch (err) {
          console.error('Query failed:', err);
          orbState = 'idle';
          renderOrb();
        }
      }
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ─── License Management ──────────────────────────────────────────────────

    let licenseStatus = null;

    async function loadLicenseStatus() {
      try {
        const res = await fetch('http://127.0.0.1:5001/license/status');
        licenseStatus = await res.json();
        updateLicenseUI();
      } catch (e) {
        console.error('Failed to load license status:', e);
      }
    }

    function updateLicenseUI() {
      if (!licenseStatus) return;

      const badge = document.getElementById('tier-badge');
      const counter = document.getElementById('usage-counter');

      if (licenseStatus.is_pro) {
        badge.textContent = 'PRO';
        badge.classList.add('pro');
        badge.classList.remove('free');
        counter.classList.add('pro');
        counter.classList.remove('free');
        counter.textContent = '';
      } else {
        badge.textContent = 'FREE';
        badge.classList.add('free');
        badge.classList.remove('pro');
        counter.classList.add('free');
        counter.classList.remove('pro');

        // Show usage
        const usage = licenseStatus.usage || {};
        const limits = licenseStatus.limits || {};
        const parts = [];
        for (const [key, max] of Object.entries(limits)) {
          const current = usage[key] || 0;
          parts.push(`${key.replace(/_/g, ' ')}: ${current}/${max}`);
        }
        counter.textContent = parts.join(' · ');
      }
    }

    window.appShowActivationPanel = function() {
      document.getElementById('upgrade-modal').classList.remove('visible');
      document.getElementById('activation-panel').classList.add('visible');
      document.getElementById('license-key-input').focus();
    };

    window.appCloseActivationPanel = function() {
      document.getElementById('activation-panel').classList.remove('visible');
      document.getElementById('license-key-input').value = '';
      document.getElementById('activation-message').textContent = '';
      document.getElementById('activation-message').className = 'message';
    };

    window.appActivateLicense = async function() {
      const key = document.getElementById('license-key-input').value.trim();
      if (!key) {
        showActivationMessage('Please enter a license key', 'error');
        return;
      }

      try {
        const res = await fetch('http://127.0.0.1:5001/license/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });

        const data = await res.json();

        if (data.success) {
          showActivationMessage('Pro activated! All features unlocked.', 'success');
          await loadLicenseStatus();
          setTimeout(() => {
            appCloseActivationPanel();
          }, 1500);
        } else {
          showActivationMessage(data.message || 'Activation failed', 'error');
        }
      } catch (e) {
        showActivationMessage('Activation failed: ' + e.message, 'error');
      }
    };

    function showActivationMessage(msg, type) {
      const msgEl = document.getElementById('activation-message');
      msgEl.textContent = msg;
      msgEl.className = 'message ' + type;
    }

    window.showUpgradeModal = function(message) {
      document.getElementById('upgrade-message').textContent = message;
      document.getElementById('upgrade-modal').classList.add('visible');
    };

    window.openPricingPage = function() {
      const url = 'https://sentinelprime.org/pricing';
      if (window.ipcRenderer && window.ipcRenderer.send) {
        window.ipcRenderer.send('open-url', url);
      } else {
        window.open(url, '_blank');
      }
    };

    // Load license status on startup
    loadLicenseStatus();
    setInterval(loadLicenseStatus, 30000); // Refresh every 30 seconds
  </script>
</body>
</html>
