<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --hud-blue: #00d4ff;
      --hud-orange: #ff6b35;
      --hud-cyan: #00d4ff;
    }

    body {
      background: #000000;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Frameless title bar — draggable, holds window controls */
    #title-bar {
      -webkit-app-region: drag;
      height: 32px;
      background: rgba(0,0,0,0.6);
      border-bottom: 1px solid rgba(0,255,136,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
    }
    #title-bar .title-text {
      font-size: 11px;
      letter-spacing: 2px;
      color: rgba(0,255,136,0.5);
      pointer-events: none;
      user-select: none;
    }
    #title-bar .win-controls {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 6px;
    }
    #title-bar .win-controls button {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      color: #888;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #title-bar .win-controls button:hover { background: rgba(255,255,255,0.12); color: #ccc; }
    #title-bar .win-controls button.close-btn:hover { background: rgba(255,60,60,0.3); color: #ff6060; }

    #orb-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      min-height: 400px;
    }

    #input-section {
      padding: 24px;
      background: rgba(10,10,15,0.95);
      border-top: 1px solid rgba(0,255,136,0.15);
    }

    #chat-input {
      width: 100%;
      background: #18181f;
      border: 1px solid rgba(0,255,136,0.15);
      color: #e0e0e0;
      padding: 14px 18px;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #chat-input:focus {
      border-color: rgba(0,255,136,0.4);
      box-shadow: 0 0 12px rgba(0,255,136,0.2);
    }

    #status-line {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      padding: 0 8px;
    }

    .worker-badge {
      font-size: 11px;
      padding: 4px 10px;
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .worker-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #666;
    }

    .worker-badge.running .dot {
      background: #00ff88;
      box-shadow: 0 0 4px #00ff88;
      animation: pulse 2s infinite;
    }

    .worker-badge.waiting .dot {
      background: #ffa500;
      box-shadow: 0 0 4px #ffa500;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #response-area {
      position: absolute;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 600px;
      background: rgba(18,18,31,0.95);
      border: 1px solid rgba(0,255,136,0.15);
      border-radius: 12px;
      padding: 16px;
      display: none;
      max-height: 200px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
    }

    #response-area.visible {
      display: block;
    }

    #plan-preview {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(18,18,31,0.98);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 12px;
      padding: 24px;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #plan-preview.visible {
      display: block;
    }

    #plan-preview h2 {
      margin-bottom: 16px;
      color: #00ff88;
      font-size: 18px;
    }

    #plan-preview .plan-complexity {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 16px;
      color: #00ff88;
    }

    .plan-subtask {
      margin-bottom: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-left: 2px solid rgba(0,255,136,0.3);
      border-radius: 4px;
    }

    .plan-subtask-index {
      font-weight: bold;
      color: #00ff88;
    }

    .plan-subtask-type {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      background: rgba(0,200,255,0.2);
      border-radius: 4px;
      margin-left: 8px;
      color: #00ccff;
    }

    .plan-subtask-text {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.5;
      color: #d0d0d0;
    }

    #plan-controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      border-top: 1px solid rgba(0,255,136,0.1);
      padding-top: 16px;
    }

    .plan-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 6px;
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .plan-btn:hover {
      background: rgba(0,255,136,0.2);
      border-color: rgba(0,255,136,0.5);
    }

    .plan-btn.deny {
      color: #ff6b6b;
      border-color: rgba(255,107,107,0.3);
      background: rgba(255,107,107,0.05);
    }

    .plan-btn.deny:hover {
      background: rgba(255,107,107,0.15);
      border-color: rgba(255,107,107,0.5);
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0,255,136,0.3);
      border-radius: 2px;
    }

    .tier-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: all 0.2s;
      z-index: 100;
    }

    .tier-badge.free {
      background: rgba(100,100,100,0.2);
      border: 1px solid rgba(100,100,100,0.4);
      color: #999;
    }

    .tier-badge.pro {
      background: rgba(255,215,0,0.15);
      border: 1px solid rgba(255,215,0,0.4);
      color: #ffd700;
      box-shadow: 0 0 12px rgba(255,215,0,0.2);
    }

    .tier-badge:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    #upgrade-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    #upgrade-modal.visible {
      display: flex;
    }

    #upgrade-modal-content {
      background: rgba(18,18,31,0.98);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #upgrade-modal-content h2 {
      margin-bottom: 12px;
      color: #ffd700;
      font-size: 22px;
    }

    #upgrade-modal-content p {
      color: #aaa;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    #upgrade-modal-buttons {
      display: flex;
      gap: 12px;
    }

    #upgrade-modal-buttons button {
      flex: 1;
      padding: 12px;
      border: 1px solid rgba(0,255,136,0.3);
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }

    #upgrade-modal-buttons button:hover {
      background: rgba(0,255,136,0.2);
      border-color: rgba(0,255,136,0.6);
    }

    #upgrade-modal-buttons button.secondary {
      background: rgba(100,100,100,0.1);
      border-color: rgba(100,100,100,0.3);
      color: #888;
    }

    #upgrade-modal-buttons button.secondary:hover {
      background: rgba(100,100,100,0.2);
      border-color: rgba(100,100,100,0.5);
    }

    #activation-panel {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(18,18,31,0.98);
      border: 1px solid rgba(0,255,136,0.3);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      display: none;
      z-index: 2100;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #activation-panel.visible {
      display: block;
    }

    #activation-panel h3 {
      margin-bottom: 16px;
      color: #00ff88;
      font-size: 16px;
    }

    #activation-panel input {
      width: 100%;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 6px;
      color: #e0e0e0;
      margin-bottom: 12px;
      font-size: 13px;
    }

    #activation-panel input:focus {
      border-color: rgba(0,255,136,0.5);
      outline: none;
    }

    #activation-panel .message {
      font-size: 12px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }

    #activation-panel .message.success {
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      border: 1px solid rgba(0,255,136,0.2);
      display: block;
    }

    #activation-panel .message.error {
      background: rgba(255,107,107,0.1);
      color: #ff6b6b;
      border: 1px solid rgba(255,107,107,0.2);
      display: block;
    }

    #activation-panel .buttons {
      display: flex;
      gap: 8px;
    }

    #activation-panel .buttons button {
      flex: 1;
      padding: 10px;
      border: 1px solid rgba(0,255,136,0.3);
      background: rgba(0,255,136,0.1);
      color: #00ff88;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    #activation-panel .buttons button:hover {
      background: rgba(0,255,136,0.2);
    }

    .usage-counter {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      color: #888;
      max-width: 200px;
    }

    .usage-counter.free {
      display: block;
    }

    .usage-counter.pro {
      display: none;
    }

    /* ── SentinelOrb visual layer ── */
    #orb-root {
      width: min(65vh, 560px);
      height: min(65vh, 560px);
      position: relative;
      flex-shrink: 0;
    }
    .sentinel-orb-canvas { position:absolute;inset:0;width:100%!important;height:100%!important; }
    .sentinel-orb-rings  { position:absolute;inset:0;color:var(--hud-blue); }
    .orb-ring-svg        { width:100%;height:100%; }
    .orb-ring            { transform-origin:200px 200px; }
    .orb-ring-1          { animation:spin 20s linear infinite; }
    .orb-ring-2          { animation:spin 12s linear infinite reverse; }
    .orb-ring-3          { animation:spin 35s linear infinite; }
    .orb-ring-4          { animation:spin 8s linear infinite reverse;opacity:0;transition:opacity .4s; }
    .orb-listening .orb-ring-4,
    .orb-speaking  .orb-ring-4,
    .orb-alert     .orb-ring-4,
    .orb-earn      .orb-ring-4 { opacity:1; }
    .orb-node { animation:nodepulse 1.6s infinite; }
    @keyframes nodepulse { 0%,100%{opacity:.3} 50%{opacity:1} }
    @keyframes spin { to { transform:rotate(360deg); } }
    .sentinel-orb-core {
      position:absolute;inset:30%;border-radius:50%;
      background:radial-gradient(circle,var(--hud-blue),transparent 70%);
      filter:blur(8px);pointer-events:none;
    }
    .sentinel-orb-label {
      position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;pointer-events:none;text-align:center;
    }
    .orb-label-text { font-size:13px;letter-spacing:3px;color:#fff;text-shadow:0 0 10px var(--hud-blue); }
    .orb-label-sub  { font-size:10px;color:var(--hud-orange);margin-top:4px;letter-spacing:1px; }
    .sentinel-orb-wave {
      position:absolute;bottom:18%;left:50%;transform:translateX(-50%);
      display:flex;gap:2px;height:24px;align-items:center;opacity:0;transition:opacity .3s;
    }
    .sentinel-orb-wave i {
      display:block;width:2px;height:100%;background:var(--hud-cyan);
      transform:scaleY(.1);transform-origin:center;box-shadow:0 0 4px var(--hud-cyan);
    }
  </style>
</head>
<body>
  <div id="title-bar">
    <span class="title-text">SENTINEL AI</span>
    <div class="win-controls">
      <button id="btn-minimize" title="Minimize">—</button>
      <button id="btn-close" class="close-btn" title="Hide to tray">✕</button>
    </div>
  </div>
  <div id="orb-container">
    <div id="orb-root"></div>
    <div id="response-area"></div>
    <div id="plan-preview"></div>
    <div class="tier-badge" id="tier-badge">FREE</div>
    <div class="usage-counter" id="usage-counter"></div>
  </div>

  <div id="upgrade-modal">
    <div id="upgrade-modal-content">
      <h2>Upgrade to SentinelAI Pro</h2>
      <p id="upgrade-message"></p>
      <div id="upgrade-modal-buttons">
        <button onclick="appShowActivationPanel()">Activate License Key</button>
        <button class="secondary" onclick="openPricingPage()">Get Pro — $199</button>
      </div>
    </div>
  </div>

  <div id="activation-panel">
    <h3>Activate SentinelAI Pro</h3>
    <input type="text" id="license-key-input" placeholder="Enter your license key">
    <div class="message" id="activation-message"></div>
    <div class="buttons">
      <button onclick="appActivateLicense()">Activate</button>
      <button class="secondary" onclick="appCloseActivationPanel()">Cancel</button>
    </div>
  </div>

  <div id="input-section">
    <div style="display:flex;gap:8px;align-items:center;">
      <input
        id="chat-input"
        type="text"
        placeholder="Ask Sentinel anything..."
        autocomplete="off"
        style="flex:1;"
      />
      <button onclick="showWalletPanel()" title="Payment Methods"
        style="padding:10px 13px;background:rgba(0,255,136,0.08);border:1px solid rgba(0,255,136,0.2);
               border-radius:20px;cursor:pointer;font-size:16px;color:#00ff88;line-height:1;">💳</button>
    </div>
    <div id="status-line"></div>
  </div>

  <script>
    // Expose THREE globally so SentinelOrb IIFE can find it
    const THREE = require('three');
    window.THREE = THREE;

    let orbState = 'idle';

    // ── SentinelOrb — inlined from static/orb.js ──────────────────────────────
    // window.THREE is set above, so the IIFE will find it.
/* ============================================================================
 * SentinelAI — orb.js
 * The center visual of the SENTINEL PRIME HUD.
 *
 * A layered Three.js star-field orb with SVG reticle rings, a core glow, and
 * an inner status label. Six states drive particle behaviour, ring speed and
 * colour:  idle | listening | thinking | speaking | alert | earn.
 *
 * Depends on a global `THREE` (load three.min.js before this file).
 * Builds itself inside #orb-root on DOMContentLoaded (or call SentinelOrb.init).
 *
 * Public API:
 *   window.SentinelOrb = {
 *     init(containerId?),      // mount (auto-called for #orb-root)
 *     setState(state),         // idle|listening|thinking|speaking|alert|earn
 *     pulse(),                 // one-shot wave from the core
 *     alert(msg),              // -> alert state + flashes a message
 *     setVolume(v),            // 0..1 mic/output level (reactive scale)
 *     getState()
 *   }
 * ========================================================================== */
(function () {
  'use strict';

  // ─── State colour + behaviour table ──────────────────────────────────────
  // colors are THREE-friendly hex ints; label is the inner status text.
  var STATES = {
    idle:      { core: 0x00d4ff, particle: 0x00d4ff, label: 'SENTINEL ONLINE', ring: 1.0,  glow: 0.55, swirl: 0.04,  expand: 0.0,  drift: 1.0 },
    listening: { core: 0x00fff7, particle: 0x00fff7, label: 'LISTENING...',    ring: 2.2,  glow: 0.85, swirl: 0.02,  expand: 1.0,  drift: 0.2 },
    thinking:  { core: 0xa855f7, particle: 0xbf80ff, label: 'PROCESSING...',   ring: 0.55, glow: 0.7,  swirl: 0.16,  expand: 0.2,  drift: 0.3 },
    speaking:  { core: 0xeaf6ff, particle: 0x9fe8ff, label: 'RESPONDING...',   ring: 2.8,  glow: 1.0,  swirl: 0.05,  expand: 0.3,  drift: 0.4, wave: true },
    alert:     { core: 0xff6b35, particle: 0xff7a45, label: 'ALERT',           ring: 3.2,  glow: 1.0,  swirl: 0.2,   expand: 0.6,  drift: 0.2, erratic: true },
    earn:      { core: 0xffd700, particle: 0xffd766, label: 'EARN MODE',       ring: 1.6,  glow: 0.9,  swirl: 0.1,   expand: 0.4,  drift: 0.4, orbit: true }
  };

  var PARTICLE_COUNT = 1200;

  var ctx = {
    mounted: false,
    state: 'idle',
    target: STATES.idle,
    // smoothed runtime values
    cur: { ring: 1.0, glow: 0.55, swirl: 0.04, expand: 0.0, drift: 1.0, r: 0, g: 0.83, b: 1.0 },
    volume: 0,
    pulseT: 0,            // decaying one-shot pulse energy
    time: 0,
    raf: null,
    three: null,         // {scene,camera,renderer,points,positions,base,vel,material}
    els: {}              // dom refs
  };

  // ─── Soft circular sprite for additive particles ─────────────────────────
  function makeSprite() {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    var grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.25, 'rgba(255,255,255,0.85)');
    grad.addColorStop(0.6, 'rgba(255,255,255,0.25)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    var tex = new THREE.Texture(c);
    tex.needsUpdate = true;
    return tex;
  }

  // ─── Layer 3: SVG reticle rings ───────────────────────────────────────────
  function buildRings(root) {
    var wrap = document.createElement('div');
    wrap.className = 'sentinel-orb-rings';
    wrap.innerHTML = [
      '<svg viewBox="0 0 400 400" class="orb-ring-svg">',
      // Ring 1 — 20s CW, dashed, triangle markers
      '  <g class="orb-ring orb-ring-1">',
      '    <circle cx="200" cy="200" r="178" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 10" opacity="0.55"/>',
      '    <polygon points="200,16 195,28 205,28" fill="currentColor"/>',
      '    <polygon points="200,384 195,372 205,372" fill="currentColor"/>',
      '    <polygon points="16,200 28,195 28,205" fill="currentColor"/>',
      '    <polygon points="384,200 372,195 372,205" fill="currentColor"/>',
      '  </g>',
      // Ring 2 — 12s CCW, node dots
      '  <g class="orb-ring orb-ring-2">',
      '    <circle cx="200" cy="200" r="150" fill="none" stroke="currentColor" stroke-width="1" opacity="0.25"/>',
      '    <circle class="orb-node" cx="200" cy="50"  r="3" fill="currentColor"/>',
      '    <circle class="orb-node" cx="350" cy="200" r="3" fill="currentColor"/>',
      '    <circle class="orb-node" cx="200" cy="350" r="3" fill="currentColor"/>',
      '    <circle class="orb-node" cx="50"  cy="200" r="3" fill="currentColor"/>',
      '    <circle class="orb-node" cx="305" cy="95"  r="2.4" fill="currentColor"/>',
      '    <circle class="orb-node" cx="95"  cy="305" r="2.4" fill="currentColor"/>',
      '  </g>',
      // Ring 3 — 35s CW, thin solid
      '  <g class="orb-ring orb-ring-3">',
      '    <circle cx="200" cy="200" r="120" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>',
      '  </g>',
      // Ring 4 — 8s CCW, only visible on active states
      '  <g class="orb-ring orb-ring-4">',
      '    <circle cx="200" cy="200" r="96" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="40 18" opacity="0.7"/>',
      '  </g>',
      '</svg>'
    ].join('\n');
    root.appendChild(wrap);
    return wrap;
  }

  // ─── Layer 4 + 5: core glow + status text + waveform ──────────────────────
  function buildOverlays(root) {
    var glow = document.createElement('div');
    glow.className = 'sentinel-orb-core';
    root.appendChild(glow);

    var label = document.createElement('div');
    label.className = 'sentinel-orb-label';
    label.innerHTML = '<span class="orb-label-text">SENTINEL ONLINE</span>' +
                      '<span class="orb-label-sub"></span>';
    root.appendChild(label);

    var wave = document.createElement('div');
    wave.className = 'sentinel-orb-wave';
    var bars = '';
    for (var i = 0; i < 28; i++) bars += '<i></i>';
    wave.innerHTML = bars;
    root.appendChild(wave);

    return { glow: glow, label: label.querySelector('.orb-label-text'),
             sub: label.querySelector('.orb-label-sub'), wave: wave,
             waveBars: wave.querySelectorAll('i') };
  }

  // ─── Layer 2: Three.js star field ─────────────────────────────────────────
  function buildThree(root) {
    if (typeof THREE === 'undefined') {
      console.warn('[SentinelOrb] THREE not loaded — orb runs without particle layer.');
      return null;
    }
    var w = root.clientWidth || 480;
    var h = root.clientHeight || 480;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 100);
    camera.position.z = 14;

    var renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h);
    renderer.domElement.className = 'sentinel-orb-canvas';
    root.appendChild(renderer.domElement);

    var positions = new Float32Array(PARTICLE_COUNT * 3);
    var base = new Float32Array(PARTICLE_COUNT * 3);   // home radius/dir
    var vel = new Float32Array(PARTICLE_COUNT);        // per-particle phase/speed
    for (var i = 0; i < PARTICLE_COUNT; i++) {
      // dense center, sparse edges: bias radius by cubing a uniform
      var u = Math.random();
      var r = 1.2 + Math.pow(u, 0.5) * 6.2;            // 1.2 .. 7.4
      var theta = Math.random() * Math.PI * 2;
      var phi = Math.acos(2 * Math.random() - 1);
      var x = r * Math.sin(phi) * Math.cos(theta);
      var y = r * Math.sin(phi) * Math.sin(theta);
      var z = r * Math.cos(phi);
      base[i * 3] = x; base[i * 3 + 1] = y; base[i * 3 + 2] = z;
      positions[i * 3] = x; positions[i * 3 + 1] = y; positions[i * 3 + 2] = z;
      vel[i] = 0.4 + Math.random() * 1.2;
    }

    var geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    var material = new THREE.PointsMaterial({
      size: 0.18,
      map: makeSprite(),
      color: new THREE.Color(STATES.idle.particle),
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true
    });

    var points = new THREE.Points(geom, material);
    scene.add(points);

    return { scene: scene, camera: camera, renderer: renderer, points: points,
             geom: geom, positions: positions, base: base, vel: vel, material: material };
  }

  // ─── Per-frame particle behaviour ─────────────────────────────────────────
  function stepParticles(t3, dt) {
    var s = ctx.cur;
    var t = ctx.time;
    var pos = t3.positions;
    var base = t3.base;
    var vel = t3.vel;
    var expand = s.expand + ctx.volume * 0.6;
    var swirl = s.swirl;
    var erratic = ctx.target.erratic ? 1 : 0;
    var orbit = ctx.target.orbit ? 1 : 0;

    for (var i = 0; i < PARTICLE_COUNT; i++) {
      var ix = i * 3, iy = ix + 1, iz = ix + 2;
      var bx = base[ix], by = base[iy], bz = base[iz];

      // swirl around Z (clockwise) — rotate base direction over time
      var ang = swirl * t * vel[i];
      var ca = Math.cos(ang), sa = Math.sin(ang);
      var rx = bx * ca - by * sa;
      var ry = bx * sa + by * ca;
      var rz = bz;

      // expansion / contraction breathing
      var br = 1 + expand * 0.5 + Math.sin(t * 1.6 + vel[i] * 6) * 0.04 * s.drift;
      var tx = rx * br, ty = ry * br, tz = rz * br;

      // earn: gentle orbital bob like coins
      if (orbit) { ty += Math.sin(t * 2 + i) * 0.25; }
      // alert: jitter
      if (erratic) {
        tx += (Math.random() - 0.5) * 0.5;
        ty += (Math.random() - 0.5) * 0.5;
      }

      // ease current position toward target (idle => slow drift)
      var k = 0.08 + (1 - s.drift) * 0.12;
      pos[ix] += (tx - pos[ix]) * k;
      pos[iy] += (ty - pos[iy]) * k;
      pos[iz] += (tz - pos[iz]) * k;
    }
    t3.geom.attributes.position.needsUpdate = true;

    // overall scale: speaking wave + volume reactive + pulse
    var waveScale = ctx.target.wave ? (1 + Math.sin(t * 9) * 0.05) : 1;
    var pulseScale = 1 + ctx.pulseT * 0.35;
    var volScale = 1 + ctx.volume * 0.18;
    var sc = waveScale * pulseScale * volScale;
    t3.points.scale.set(sc, sc, sc);
    t3.points.rotation.z += dt * 0.05;

    // colour ease
    t3.material.color.setRGB(s.r, s.g, s.b);
    t3.material.opacity = 0.78 + s.glow * 0.22;
  }

  // ─── Main loop ────────────────────────────────────────────────────────────
  function loop() {
    ctx.raf = requestAnimationFrame(loop);
    if (document.hidden) return;
    var now = performance.now() / 1000;
    var dt = Math.min(0.05, now - (ctx._last || now));
    ctx._last = now;
    ctx.time += dt;

    // ease cur -> target
    var T = ctx.target;
    var tc = new THREE.Color ? null : null;
    ease('ring', T.ring, 0.08);
    ease('glow', T.glow, 0.08);
    ease('swirl', T.swirl, 0.05);
    ease('expand', T.expand, 0.06);
    ease('drift', T.drift, 0.06);
    // colour channels
    var col = ctx._targetCol;
    ctx.cur.r += (col.r - ctx.cur.r) * 0.07;
    ctx.cur.g += (col.g - ctx.cur.g) * 0.07;
    ctx.cur.b += (col.b - ctx.cur.b) * 0.07;

    // decay pulse + volume
    ctx.pulseT *= 0.92;
    if (ctx.pulseT < 0.001) ctx.pulseT = 0;

    // drive rings (animation-duration via CSS var ratio)
    if (ctx.els.rings) {
      ctx.els.rings.style.setProperty('--orb-ring-speed', (1 / Math.max(0.2, ctx.cur.ring)).toFixed(3));
    }
    // core glow color + intensity
    if (ctx.els.core) {
      var hex = rgbToCss(ctx.cur);
      ctx.els.core.style.background =
        'radial-gradient(circle, ' + hex + ' 0%, ' + rgbaCss(ctx.cur, 0.35) + ' 35%, transparent 70%)';
      ctx.els.core.style.opacity = (0.4 + ctx.cur.glow * 0.6).toFixed(3);
    }
    if (ctx.els.root) {
      ctx.els.root.style.color = rgbToCss(ctx.cur); // drives SVG currentColor
    }

    // waveform bars (listening/speaking)
    if (ctx.els.waveBars) {
      var active = ctx.state === 'listening' || ctx.state === 'speaking';
      ctx.els.wave.style.opacity = active ? '1' : '0.15';
      for (var b = 0; b < ctx.els.waveBars.length; b++) {
        var base = active ? (0.25 + ctx.volume * 0.7) : 0.12;
        var hgt = base + Math.abs(Math.sin(ctx.time * 6 + b * 0.5)) * (active ? 0.75 : 0.12);
        ctx.els.waveBars[b].style.transform = 'scaleY(' + hgt.toFixed(3) + ')';
      }
    }

    if (ctx.three) stepParticles(ctx.three, dt);
    if (ctx.three) ctx.three.renderer.render(ctx.three.scene, ctx.three.camera);
  }

  function ease(key, target, k) { ctx.cur[key] += (target - ctx.cur[key]) * k; }

  function rgbToCss(c) {
    return 'rgb(' + (c.r * 255 | 0) + ',' + (c.g * 255 | 0) + ',' + (c.b * 255 | 0) + ')';
  }
  function rgbaCss(c, a) {
    return 'rgba(' + (c.r * 255 | 0) + ',' + (c.g * 255 | 0) + ',' + (c.b * 255 | 0) + ',' + a + ')';
  }
  function hexToRgb(hex) {
    return { r: ((hex >> 16) & 255) / 255, g: ((hex >> 8) & 255) / 255, b: (hex & 255) / 255 };
  }

          + Add Payment Method</button>
        <div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.06);padding-top:12px;">
          <div style="color:#888;font-size:11px;margin-bottom:6px;">Per-transaction limit:</div>
          <div style="display:flex;gap:8px;">
            <input id="limit-amount" type="number" value="500" min="1" max="10000"
              style="flex:1;padding:7px;background:#111;border:1px solid #333;color:#fff;border-radius:5px;font-size:12px;">
            <button onclick="saveSpendingLimit()"
              style="padding:7px 14px;background:rgba(0,170,255,0.15);border:1px solid rgba(0,170,255,0.3);
              color:#00aaff;border-radius:5px;cursor:pointer;font-size:12px;">Save Limit</button>
          </div>
        </div>
      </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
    };

    function _formatMethodDisplay(m) {
      if (!m.display) return m.type;
      const d = m.display;
      if (d.last4) return `${d.brand || 'Card'} ****${d.last4} · exp ${d.expiry || ''}`;
      if (d.email) return d.email;
      if (d.wallet) return `${d.currency || ''} ${d.wallet}`;
      if (d.username) return d.username;
      if (d.cashtag) return d.cashtag;
      if (d.device) return d.device;
      return m.type;
    }

    window.setPaymentDefault = async function(id) {
      await fetch(`http://127.0.0.1:5001/payments/methods/${id}/default`, {method:'POST'}).catch(()=>{});
      document.getElementById('wallet-panel')?.remove();
      showWalletPanel();
    };

    window.removePaymentMethod = async function(id) {
      if (!confirm('Remove this payment method?')) return;
      await fetch(`http://127.0.0.1:5001/payments/methods/${id}`, {method:'DELETE'}).catch(()=>{});
      document.getElementById('wallet-panel')?.remove();
      showWalletPanel();
    };

    window.saveSpendingLimit = async function() {
      const amt = parseFloat(document.getElementById('limit-amount')?.value || '500');
      await fetch('http://127.0.0.1:5001/payments/limits', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({period:'per_transaction', amount:amt, category:'all'})
      }).catch(()=>{});
      document.getElementById('wallet-panel')?.remove();
      showWalletPanel();
    };

    // ── Add Payment Form ──────────────────────────────────────────────────────
    window.showAddPaymentForm = function() {
      document.getElementById('wallet-panel')?.remove();
      document.getElementById('add-payment-form')?.remove();
      const html = `<div id="add-payment-form" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
        background:rgba(8,8,20,0.98);border:1px solid rgba(0,255,136,0.3);border-radius:12px;
        padding:24px;min-width:400px;max-height:85vh;overflow-y:auto;z-index:3001;backdrop-filter:blur(10px);">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <h3 style="color:#00ff88;">Add Payment Method</h3>
          <button onclick="document.getElementById('add-payment-form').remove();showWalletPanel()"
            style="background:none;border:none;color:#666;cursor:pointer;font-size:18px;">✕</button>
        </div>
        <div style="margin-bottom:10px;">
          <label style="color:#888;font-size:11px;display:block;margin-bottom:5px;">TYPE</label>
          <select id="pm-type" onchange="updatePMFields()"
            style="width:100%;padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:6px;">
            <option value="card">💳 Credit / Debit Card</option>
            <option value="paypal">🅿 PayPal</option>
            <option value="amazon_pay">📦 Amazon Pay</option>
            <option value="google_pay">G Google Pay</option>
            <option value="venmo">V Venmo</option>
            <option value="cashapp">$ Cash App</option>
            <option value="crypto_eth">⟠ Ethereum Wallet</option>
            <option value="crypto_usdc">💵 USDC Stablecoin</option>
            <option value="crypto_btc">₿ Bitcoin Wallet</option>
            <option value="bank_ach">🏦 Bank Account (ACH)</option>
          </select>
        </div>
        <div style="margin-bottom:10px;">
          <label style="color:#888;font-size:11px;display:block;margin-bottom:5px;">NICKNAME</label>
          <input id="pm-nickname" type="text" placeholder="e.g. Chase Visa, PayPal Main"
            style="width:100%;padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:6px;box-sizing:border-box;">
        </div>
        <div id="pm-fields"></div>
        <button onclick="savePM()"
          style="width:100%;padding:12px;margin-top:12px;background:rgba(0,255,136,0.15);
          border:1px solid rgba(0,255,136,0.4);color:#00ff88;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;">
          🔒 Save Securely</button>
        <p style="color:#444;font-size:10px;margin-top:10px;text-align:center;">
          Encrypted on this device only. Never transmitted. Never stored in cloud.</p>
      </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      updatePMFields();
    };

    window.updatePMFields = function() {
      const t = document.getElementById('pm-type')?.value;
      const inp = (id, ph, type='text') => `<input id="${id}" type="${type}" placeholder="${ph}"
        style="width:100%;padding:9px;background:#111;border:1px solid #333;color:#fff;border-radius:5px;margin-bottom:8px;box-sizing:border-box;">`;
      const lbl = (txt) => `<label style="color:#888;font-size:10px;display:block;margin-bottom:4px;">${txt}</label>`;
      const row = (...items) => `<div style="display:flex;gap:8px;">${items.map(i=>`<div style="flex:1;">${i}</div>`).join('')}</div>`;
      const fields = {
        card:       lbl('CARD NUMBER') + inp('pm-f1','Card Number','password') + row(lbl('EXPIRY') + inp('pm-f2','MM/YY'), lbl('CVV') + inp('pm-f3','CVV','password')),
        paypal:     lbl('EMAIL') + inp('pm-f1','PayPal Email','email') + lbl('PASSWORD') + inp('pm-f2','Password','password'),
        amazon_pay: lbl('EMAIL') + inp('pm-f1','Amazon Email','email') + lbl('PASSWORD') + inp('pm-f2','Password','password'),
        google_pay: lbl('EMAIL') + inp('pm-f1','Google Email','email') + lbl('TOKEN') + inp('pm-f2','Device Token','password'),
        venmo:      lbl('USERNAME') + inp('pm-f1','@username') + lbl('PASSWORD') + inp('pm-f2','Password','password'),
        cashapp:    lbl('CASHTAG') + inp('pm-f1','$cashtag') + lbl('PASSWORD') + inp('pm-f2','Password','password'),
        crypto_eth: lbl('WALLET ADDRESS') + inp('pm-f1','0x...') + lbl('PRIVATE KEY') + inp('pm-f2','Private Key','password'),
        crypto_usdc:lbl('WALLET ADDRESS') + inp('pm-f1','0x...') + lbl('PRIVATE KEY') + inp('pm-f2','Private Key','password') + lbl('NETWORK') + `<select id="pm-f3" style="width:100%;padding:9px;background:#111;border:1px solid #333;color:#fff;border-radius:5px;margin-bottom:8px;"><option>ethereum</option><option>polygon</option><option>arbitrum</option></select>`,
        crypto_btc: lbl('WALLET ADDRESS') + inp('pm-f1','bc1...') + lbl('PRIVATE KEY') + inp('pm-f2','Private Key','password'),
        bank_ach:   lbl('ROUTING NUMBER') + inp('pm-f1','Routing Number') + lbl('ACCOUNT NUMBER') + inp('pm-f2','Account Number','password'),
      };
      const el = document.getElementById('pm-fields');
      if (el) el.innerHTML = fields[t] || fields.paypal;
    };

    window.savePM = async function() {
      const type = document.getElementById('pm-type')?.value;
      const nickname = document.getElementById('pm-nickname')?.value?.trim();
      if (!nickname) { alert('Please enter a nickname.'); return; }
      const f1 = document.getElementById('pm-f1')?.value || '';
      const f2 = document.getElementById('pm-f2')?.value || '';
      const f3 = document.getElementById('pm-f3')?.value || '';
      const detailsMap = {
        card:       {card_number:f1, expiry:f2, cvv:f3},
        paypal:     {email:f1, password:f2},
        amazon_pay: {email:f1, password:f2},
        google_pay: {email:f1, token:f2},
        venmo:      {username:f1.replace('@',''), password:f2},
        cashapp:    {cashtag:f1.replace('$',''), password:f2},
        crypto_eth: {wallet_address:f1, private_key:f2},
        crypto_usdc:{wallet_address:f1, private_key:f2, network:f3||'ethereum'},
        crypto_btc: {wallet_address:f1, private_key:f2},
        bank_ach:   {routing_number:f1, account_number:f2, account_type:'checking'},
      };
      const details = detailsMap[type] || {};
      const res = await fetch('http://127.0.0.1:5001/payments/methods/add', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({type, nickname, details})
      }).catch(e=>({ok:false}));
      const data = res.json ? await res.json() : {};
      if (data.status === 'ok') { document.getElementById('add-payment-form')?.remove(); showWalletPanel(); }
      else alert('Error: ' + (data.error || 'Save failed'));
    };

    // ── Purchase Approval Modal ───────────────────────────────────────────────
    window.showPurchaseApproval = async function(purchaseData) {
      document.getElementById('purchase-approval')?.remove();
      let methods = [];
      try {
        const r = await fetch('http://127.0.0.1:5001/payments/methods');
        methods = (await r.json()).methods || [];
      } catch(_) {}

      const allPrices = (purchaseData.all_prices || []).filter(p => p.price);
      const html = `<div id="purchase-approval" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
        background:rgba(8,8,20,0.98);border:1px solid rgba(0,255,136,0.3);border-radius:12px;
        padding:28px;min-width:420px;z-index:3000;backdrop-filter:blur(10px);">
        <h3 style="color:#00ff88;margin-bottom:4px;">🛒 Purchase Approval</h3>
        <p style="color:#666;font-size:12px;margin-bottom:18px;">Sentinel found the best deal — review and approve</p>
        <div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:16px;margin-bottom:14px;border:1px solid rgba(255,255,255,0.07);">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="color:#888;font-size:13px;">Product</span>
            <span style="color:#fff;font-weight:500;max-width:60%;text-align:right;font-size:13px;">${escapeHtml(purchaseData.product || '')}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="color:#888;font-size:13px;">Best Price</span>
            <span style="color:#00ff88;font-weight:700;font-size:20px;">${escapeHtml(String(purchaseData.price || '—'))}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:${allPrices.length > 1 ? '8' : '0'}px;">
            <span style="color:#888;font-size:13px;">From</span>
            <span style="color:#fff;font-size:13px;">${escapeHtml(purchaseData.site || '')}</span>
          </div>
          ${allPrices.length > 1 ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05);">
            <div style="color:#555;font-size:10px;margin-bottom:5px;">ALL PRICES</div>
            ${allPrices.map(p=>`<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px;">
              <span style="color:#666;">${escapeHtml(p.site||'')}</span>
              <span style="color:#888;">${escapeHtml(p.price||'—')}</span>
            </div>`).join('')}</div>` : ''}
        </div>
        ${methods.length > 0 ? `<div style="margin-bottom:14px;">
          <label style="color:#888;font-size:11px;display:block;margin-bottom:6px;">PAY WITH</label>
          <select id="pa-method" style="width:100%;padding:10px;background:#111;border:1px solid #333;color:#fff;border-radius:6px;">
            ${methods.map(m=>`<option value="${m.id}" ${m.is_default?'selected':''}>${_formatMethodDisplay(m)} — ${escapeHtml(m.nickname)}</option>`).join('')}
          </select>
        </div>` : `<p style="color:#888;font-size:12px;margin-bottom:14px;">No payment method saved.
          <a href="#" onclick="document.getElementById('purchase-approval').remove();showWalletPanel()" style="color:#00ff88;">Add one →</a></p>`}
        <div style="display:flex;gap:10px;">
          <button onclick="approvePurchase()" ${methods.length===0?'disabled':''} id="pa-confirm-btn"
            style="flex:2;padding:14px;background:rgba(0,255,136,0.18);border:1px solid rgba(0,255,136,0.4);
            color:#00ff88;border-radius:8px;cursor:pointer;font-weight:700;font-size:13px;">
            ✓ Approve Purchase</button>
          <button onclick="document.getElementById('purchase-approval').remove()"
            style="flex:1;padding:14px;background:none;border:1px solid #333;color:#666;border-radius:8px;cursor:pointer;">Cancel</button>
        </div>
        <p style="color:#444;font-size:10px;margin-top:10px;text-align:center;">
          SentinelWeb will use saved credentials to complete checkout.</p>
      </div>`;
      document.body.insertAdjacentHTML('beforeend', html);
      window._pendingPurchase = purchaseData;
    };

    window.approvePurchase = async function() {
      const purchaseData = window._pendingPurchase || {};
      const methodId = document.getElementById('pa-method')?.value;
      purchaseData.method_id = methodId;
      const btn = document.getElementById('pa-confirm-btn');
      if (btn) { btn.disabled = true; btn.textContent = '⏳ Processing...'; }
      try {
        const res = await fetch('http://127.0.0.1:5001/payments/execute', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify(purchaseData)
        });
        const result = await res.json();
        document.getElementById('purchase-approval')?.remove();
        orbState = result.status === 'success' ? 'speaking' : 'idle';
        renderOrb();
        responseArea.textContent = result.message || (result.status === 'success' ? 'Purchase complete!' : 'Purchase failed.');
        responseArea.classList.add('visible');
        setTimeout(() => { responseArea.classList.remove('visible'); orbState = 'idle'; renderOrb(); }, 8000);
      } catch(e) {
        document.getElementById('purchase-approval')?.remove();
        responseArea.textContent = 'Error processing purchase: ' + e.message;
        responseArea.classList.add('visible');
      }
    };
  </script>
</body>
</html>
