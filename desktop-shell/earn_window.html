<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Earn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      padding: 20px;
      overflow-y: auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #00ff88;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #111118;
      border: 1px solid rgba(0,255,136,0.15);
      border-radius: 8px;
      padding: 16px;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #00ff88;
      margin-top: 6px;
    }

    .jobs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .jobs-table th {
      text-align: left;
      padding: 8px 12px;
      background: #111118;
      border-bottom: 1px solid rgba(0,255,136,0.15);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 1px;
      color: #666;
    }

    .jobs-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }

    .jobs-table tr:hover {
      background: rgba(0,255,136,0.05);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-bounty {
      background: rgba(0,255,136,0.15);
      color: #00ff88;
      border: 1px solid rgba(0,255,136,0.3);
    }

    .badge-vdp {
      background: rgba(255,255,255,0.05);
      color: #666;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .reward-text {
      color: #00ff88;
      font-weight: 600;
    }

    .reward-vdp {
      color: #555;
    }

    .accept-btn {
      background: linear-gradient(135deg, #00aa55, #00ff88);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }

    .accept-btn:hover {
      opacity: 0.85;
      transform: scale(1.03);
    }

    .accept-btn:active {
      transform: scale(0.97);
    }

    .accept-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    #status-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }

    #status-msg.success {
      background: rgba(0,255,136,0.1);
      border: 1px solid rgba(0,255,136,0.3);
      color: #00ff88;
      display: block;
    }

    #status-msg.error {
      background: rgba(255,60,60,0.1);
      border: 1px solid rgba(255,60,60,0.3);
      color: #ff4444;
      display: block;
    }

    .scope-list {
      color: #888;
      font-size: 11px;
    }

    a.prog-link {
      color: #00aaff;
      text-decoration: none;
    }
    a.prog-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
    <h1 style="margin:0;">💰 Sentinel Earn</h1>
    <div style="display:flex;gap:8px;">
      <button id="scan-now-btn" onclick="loadJobs(true, false)"
        style="padding:8px 20px;background:linear-gradient(135deg,#00aa55,#00ff88);color:#000;border:none;
               border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;letter-spacing:0.5px;">
        ⟳ Scan Now
      </button>
      <button onclick="loadJobs(true, true)"
        style="padding:8px 16px;background:#1a1400;color:#ffb000;border:1px solid rgba(255,176,0,0.4);
               border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;">
        ⚡ Force
      </button>
    </div>
  </div>

  <div class="stats" id="stats-container">
    <div class="stat-card">
      <div class="stat-label">Total Programs</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Bounty Programs</div>
      <div class="stat-value" id="stat-bounty">—</div>
    </div>
  </div>

  <div id="status-msg"></div>
  <div id="earn-diag" style="font-size:11px;font-family:monospace;color:#888;margin-bottom:12px;padding:10px;background:#0a0a0f;border-radius:6px;border:1px solid rgba(0,255,136,0.15);"></div>
  <!-- Analysis progress panel — hidden until a job is accepted -->
  <div id="analysis-panel" style="display:none;margin-bottom:16px;background:#0d1a14;border:1px solid rgba(0,255,136,0.25);border-radius:8px;padding:14px;">
    <div style="font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#00ff88;margin-bottom:10px;">
      ANALYSIS PROGRESS
      <button onclick="document.getElementById('analysis-panel').style.display='none'" style="float:right;background:none;border:none;color:#444;cursor:pointer;font-size:14px;">✕</button>
    </div>
    <div id="analysis-log" style="max-height:200px;overflow-y:auto;font-family:monospace;font-size:11px;color:#aaa;line-height:1.7;"></div>
  </div>

  <table class="jobs-table">
    <thead>
      <tr>
        <th>Program</th>
        <th>Type</th>
        <th>Reward</th>
        <th>In-Scope Targets</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="jobs-body">
      <tr><td colspan="5" style="text-align: center; color: #666; padding: 30px;">Loading bounty programs...</td></tr>
    </tbody>
  </table>

  <script>
    const BASE = 'http://127.0.0.1:5001';

    async function loadEarnDiag() {
      try {
        const r = await fetch(`${BASE}/api/earn/diagnostics`);
        const d = await r.json();
        const el = document.getElementById('earn-diag');
        if (!el) return;
        el.innerHTML = `Source: <b>${(d.program_source||'?').toUpperCase()}</b> · Last refresh: ${d.last_refresh||'never'} · Cache: ${d.cache_age_minutes != null ? d.cache_age_minutes+' min' : '—'} · API: ${d.api_status||'—'} · ${d.program_count||0} cached · ${d.discovered_total||'?'} discovered · ${d.last_duration_ms||'—'} ms`;
      } catch (_) {}
    }

    async function loadJobs(manual = false, force = false) {
      const btn = document.getElementById('scan-now-btn');
      if (manual && btn) { btn.disabled = true; btn.textContent = '⟳ Scanning...'; }
      const qs = force ? '?refresh=1&force=1&limit=50' : (manual ? '?refresh=1&limit=50' : '?limit=50');
      try {
        const res = await fetch(`${BASE}/earn/jobs${qs}`);
        const data = await res.json();
        if (manual && btn) { btn.disabled = false; btn.textContent = '⟳ Scan Now'; }
        await loadEarnDiag();
        if (manual && data.discovery) {
          const sm = document.getElementById('status-msg');
          if (sm) sm.innerHTML = `<div class="status-msg">Refreshed — source ${data.discovery.source}, ${data.discovery.discovered_total} programs (${data.discovery.duration_ms} ms)</div>`;
        }

        if (!data || !data.jobs) return;

        const jobs = data.jobs;
        const bountyCount = jobs.filter(j => j.offers_bounties).length;

        document.getElementById('stat-total').textContent = jobs.length;
        document.getElementById('stat-bounty').textContent = bountyCount;

        const tbody = document.getElementById('jobs-body');
        if (jobs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#666;padding:30px;">No bounty programs found.</td></tr>';
          return;
        }

        tbody.innerHTML = jobs.map((job, idx) => {
          const isBounty = job.offers_bounties;
          const reward = job.reward || job.reward_range || '—';
          const rewardClass = isBounty ? 'reward-text' : 'reward-vdp';
          const badge = isBounty
            ? '<span class="badge badge-bounty">BOUNTY</span>'
            : '<span class="badge badge-vdp">VDP</span>';
          const scope = (job.scope || []).slice(0, 3).join(', ') || '—';
          const title = escapeHtml(job.title || job.program || 'Unknown');
          const progUrl = escapeHtml(job.url || '#');

          return `<tr>
            <td><a class="prog-link" href="${progUrl}" target="_blank">${title}</a></td>
            <td>${badge}</td>
            <td class="${rewardClass}">${escapeHtml(reward)}</td>
            <td class="scope-list">${escapeHtml(scope)}</td>
            <td>
              ${isBounty
                ? `<button class="accept-btn" onclick="acceptJob(${idx})" id="btn-${idx}">Accept &amp; Work</button>`
                : '<span style="color:#444;font-size:11px;">—</span>'}
            </td>
          </tr>`;
        }).join('');

        // Store jobs for accept handler
        window._earnJobs = jobs;
      } catch (e) {
        console.error('Failed to load jobs:', e);
        if (manual && btn) { btn.disabled = false; btn.textContent = '⟳ Scan Now'; }
      }
    }

    async function acceptJob(idx) {
      const job = window._earnJobs && window._earnJobs[idx];
      if (!job) return;

      const btn = document.getElementById(`btn-${idx}`);
      if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

      try {
        const res = await fetch(`${BASE}/earn/accept`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(job)
        });
        const data = await res.json();

        const msg = document.getElementById('status-msg');
        if (data.status === 'accepted' || data.status === 'ok') {
          msg.className = 'success';
          msg.textContent = '✓ ' + (data.message || 'Sentinel is analyzing the target. Watch the Log tab.');
          // Open Log tab to show analysis progress
          try {
            const { ipcRenderer } = require('electron');
            ipcRenderer.send('open-log');
          } catch (_) {}
        } else {
          msg.className = 'error';
          msg.textContent = '✗ Error: ' + (data.error || 'Unknown error');
        }

        if (btn) { btn.disabled = false; btn.textContent = 'Accept & Work'; }
      } catch (e) {
        console.error('Accept failed:', e);
        const msg = document.getElementById('status-msg');
        msg.className = 'error';
        msg.textContent = 'Network error: ' + e.message;
        if (btn) { btn.disabled = false; btn.textContent = 'Accept & Work'; }
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    // ── Socket.IO: listen for [EARN] analysis progress ─────────────────────────
    function appendAnalysisLog(msg, level) {
      const panel = document.getElementById('analysis-panel');
      const log = document.getElementById('analysis-log');
      if (!panel || !log) return;
      panel.style.display = 'block';
      const colors = { error: '#ff4444', success: '#00ff88', warning: '#ffa500', info: '#aaa' };
      const div = document.createElement('div');
      div.style.color = colors[level] || '#aaa';
      div.textContent = msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    (function initEarnSocket() {
      const script = document.createElement('script');
      script.src = 'https://cdn.socket.io/4.7.5/socket.io.min.js';
      script.onload = function() {
        try {
          const socket = window.io('http://127.0.0.1:5001', { transports: ['websocket', 'polling'] });
          socket.on('log_event', function(data) {
            if (data.type !== 'earn') return;
            const msg = data.message || '';
            const level = data.level || 'info';
            appendAnalysisLog(msg, level);
            // Update status-msg for key events
            const statusEl = document.getElementById('status-msg');
            if (msg.includes('[EARN] SUCCESS') || msg.includes('Analysis saved')) {
              if (statusEl) { statusEl.className = 'success'; statusEl.textContent = '✓ ' + msg.replace('[EARN] ', ''); }
            } else if (msg.includes('[EARN] FAIL') || msg.includes('Analysis failed')) {
              if (statusEl) { statusEl.className = 'error'; statusEl.textContent = '✗ ' + msg.replace('[EARN] ', ''); }
            }
          });
        } catch(e) { console.warn('[Earn] Socket.IO init failed:', e); }
      };
      document.head.appendChild(script);
    })();

    loadJobs();
    setInterval(loadJobs, 30000);
  </script>
</body>
</html>
