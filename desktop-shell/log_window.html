<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sentinel Log</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #header {
      background: #0a0a0f;
      border-bottom: 1px solid rgba(0,255,136,0.15);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #header-title {
      font-size: 13px;
      font-weight: 700;
      color: #00ff88;
      letter-spacing: 1.5px;
      flex: 1;
    }
    #header-title span { color: #555; font-weight: 400; font-size: 11px; margin-left: 6px; }
    .hdr-btn {
      padding: 4px 11px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px;
      background: #111;
      color: #aaa;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      transition: all .15s;
    }
    .hdr-btn:hover { background: #1a1a1a; color: #fff; border-color: rgba(255,255,255,0.25); }
    #conn-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #444;
      transition: background .3s;
    }
    #conn-dot.connected { background: #00ff88; box-shadow: 0 0 5px #00ff88; }
    #conn-dot.disconnected { background: #ff4444; box-shadow: 0 0 5px #ff4444; }

    /* Filter bar */
    #filter-bar {
      background: #0a0a0f;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    #filter-bar span { font-size: 10px; color: #555; margin-right: 4px; }
    .filter-btn {
      padding: 3px 10px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      background: #111;
      color: #666;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      transition: all .15s;
    }
    .filter-btn:hover { color: #aaa; }
    .filter-btn.active { background: rgba(0,255,136,0.1); color: #00ff88; border-color: rgba(0,255,136,0.3); }
    .filter-btn[data-type="forge"].active   { background: rgba(0,170,255,0.1); color: #00aaff; border-color: rgba(0,170,255,0.3); }
    .filter-btn[data-type="earn"].active    { background: rgba(255,204,0,0.1); color: #ffcc00; border-color: rgba(255,204,0,0.3); }
    .filter-btn[data-type="guardian"].active{ background: rgba(170,102,255,0.1); color: #aa66ff; border-color: rgba(170,102,255,0.3); }
    .filter-btn[data-type="aider"].active   { background: rgba(255,136,0,0.1); color: #ff8800; border-color: rgba(255,136,0,0.3); }
    .filter-btn[data-type="error"].active   { background: rgba(255,68,68,0.1); color: #ff4444; border-color: rgba(255,68,68,0.3); }
    .filter-btn[data-type="system"].active  { background: rgba(0,255,136,0.1); color: #00ff88; border-color: rgba(0,255,136,0.3); }

    /* Terminal area */
    #terminal-container {
      flex: 1;
      overflow: hidden;
      padding: 4px;
      background: #000;
    }
    #terminal { width: 100%; height: 100%; }

    /* Status bar */
    #status-bar {
      background: #0a0a0f;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding: 4px 14px;
      font-size: 10px;
      color: #444;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #event-count { color: #666; }
  </style>
</head>
<body>

<div id="header">
  <div id="conn-dot" title="Socket.IO connection"></div>
  <div id="header-title">◈ SENTINEL LOG <span id="conn-status">CONNECTING...</span></div>
  <button class="hdr-btn" onclick="clearLog()">CLEAR</button>
  <button class="hdr-btn" onclick="saveLog()">SAVE</button>
</div>

<div id="filter-bar">
  <span>Filter:</span>
  <button class="filter-btn active" data-type="all" onclick="setFilter('all', this)">ALL</button>
  <button class="filter-btn" data-type="forge"    onclick="setFilter('forge', this)">FORGE</button>
  <button class="filter-btn" data-type="earn"     onclick="setFilter('earn', this)">EARN</button>
  <button class="filter-btn" data-type="system"   onclick="setFilter('system', this)">SYSTEM</button>
  <button class="filter-btn" data-type="guardian" onclick="setFilter('guardian', this)">GUARDIAN</button>
  <button class="filter-btn" data-type="aider"    onclick="setFilter('aider', this)">AIDER</button>
  <button class="filter-btn" data-type="error"    onclick="setFilter('error', this)">ERRORS</button>
</div>

<div id="terminal-container">
  <div id="terminal"></div>
</div>

<div id="status-bar">
  <span id="event-count">0 events</span>
  <span id="filter-label">Showing: ALL</span>
</div>

<!-- Load Socket.IO, Xterm.js, and fit addon from CDN -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>

<script>
  // ── Xterm.js setup ───────────────────────────────────────────────────────
  const term = new Terminal({
    theme: {
      background: '#000000',
      foreground: '#e0e0e0',
      cursor: '#00ff88',
    },
    fontFamily: '"Cascadia Code", "Consolas", "Courier New", monospace',
    fontSize: 12,
    lineHeight: 1.4,
    scrollback: 10000,
    convertEol: true,
  });

  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  window.addEventListener('resize', () => fitAddon.fit());

  term.writeln('\x1b[36m[SENTINEL LOG] Connecting to backend...\x1b[0m');

  // ── State ──────────────────────────────────────────────────────────────────
  let currentFilter = 'all';
  let eventCount = 0;
  const allEvents = []; // { type, level, message, timestamp }

  // ── Color/prefix helpers ──────────────────────────────────────────────────
  function getColor(level) {
    switch ((level || '').toLowerCase()) {
      case 'success': return '\x1b[32m';
      case 'error':   return '\x1b[31m';
      case 'warning': return '\x1b[33m';
      case 'aider':   return '\x1b[35m';
      case 'info':    return '\x1b[36m';
      default:        return '\x1b[37m';
    }
  }

  function getTypeColor(type) {
    switch ((type || '').toLowerCase()) {
      case 'forge':    return '\x1b[34m'; // blue
      case 'earn':     return '\x1b[33m'; // yellow
      case 'guardian': return '\x1b[35m'; // magenta
      case 'aider':    return '\x1b[35m'; // magenta
      case 'system':   return '\x1b[36m'; // cyan
      default:         return '\x1b[37m'; // white
    }
  }

  function getPrefix(type) {
    const t = (type || 'system').toUpperCase();
    const color = getTypeColor(type);
    return `${color}[${t}]\x1b[0m`;
  }

  function writeEvent(evt) {
    const color = getColor(evt.level);
    const prefix = getPrefix(evt.type);
    const time = evt.timestamp
      ? new Date(evt.timestamp).toLocaleTimeString()
      : new Date().toLocaleTimeString();
    term.writeln(`\x1b[90m${time}\x1b[0m ${prefix} ${color}${evt.message}\x1b[0m`);
  }

  // ── Filter logic ───────────────────────────────────────────────────────────
  function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('filter-label').textContent = `Showing: ${type.toUpperCase()}`;

    term.clear();
    const filtered = type === 'all'
      ? allEvents
      : type === 'error'
        ? allEvents.filter(e => e.level === 'error' || e.level === 'warning')
        : allEvents.filter(e => (e.type || '').toLowerCase() === type);
    filtered.forEach(writeEvent);
  }

  function matchesFilter(evt) {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'error') return evt.level === 'error' || evt.level === 'warning';
    return (evt.type || '').toLowerCase() === currentFilter;
  }

  // ── Socket.IO ──────────────────────────────────────────────────────────────
  const socket = io('http://localhost:5001', { transports: ['websocket', 'polling'] });

  const connDot = document.getElementById('conn-dot');
  const connStatus = document.getElementById('conn-status');

  socket.on('connect', () => {
    connDot.className = 'connected';
    connStatus.textContent = 'LIVE';
    term.writeln('\x1b[32m[CONNECTED] Socket.IO live — streaming events\x1b[0m');
  });

  socket.on('disconnect', () => {
    connDot.className = 'disconnected';
    connStatus.textContent = 'DISCONNECTED';
    term.writeln('\x1b[31m[DISCONNECTED] Socket.IO connection lost\x1b[0m');
  });

  socket.on('log_event', (data) => {
    allEvents.push(data);
    eventCount++;
    document.getElementById('event-count').textContent = `${eventCount} event${eventCount !== 1 ? 's' : ''}`;

    if (matchesFilter(data)) {
      writeEvent(data);
    }
  });

  // ── Buttons ─────────────────────────────────────────────────────────────────
  function clearLog() {
    term.clear();
    allEvents.length = 0;
    eventCount = 0;
    document.getElementById('event-count').textContent = '0 events';
    term.writeln('\x1b[90m[Log cleared]\x1b[0m');
  }

  function saveLog() {
    const lines = allEvents.map(e => {
      const time = e.timestamp
        ? new Date(e.timestamp).toLocaleTimeString()
        : new Date().toLocaleTimeString();
      return `[${time}] [${(e.type || 'system').toUpperCase()}] [${e.level || 'info'}] ${e.message}`;
    }).join('\n');

    const blob = new Blob([lines], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sentinel_log_${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
